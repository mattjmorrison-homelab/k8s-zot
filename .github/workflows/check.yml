name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: k8s-amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: mattjmorrison-homelab/actions-helm@d09c1873d8d866fcb1c701db8bee75a23456f798 # filter-hook-jobs-too
        with:
          namespace: zot
          # No live dry-run (zot namespace lacks `zot-ci` ServiceAccount yet;
          # unlike monitoring/garage/homepage/github-runner from
          # pre-library-chart-conversion era). helm lint validation still runs.
          dry-run: "false"
