apiVersion: v1
kind: ServiceAccount
metadata:
  name: zot-bootstrap
  namespace: zot
  annotations:
    # zot-bootstrap-secrets (a PreSync hook) runs as this ServiceAccount --
    # without an early sync-wave, ArgoCD applies PreSync hooks before this
    # plain resource exists, and the Job fails to even create a pod
    # ("serviceaccount not found"). Matches k8s-garage's own bootstrap SA.
    argocd.argoproj.io/sync-wave: "-5"
