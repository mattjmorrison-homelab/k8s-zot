apiVersion: v1
kind: ServiceAccount
metadata:
  name: zot-bootstrap
  namespace: zot
  annotations:
    # zot-bootstrap-secrets runs as this ServiceAccount. ArgoCD orders by
    # phase first, then wave within a phase -- a plain resource's wave
    # never places it ahead of a PreSync hook, regardless of value, since
    # the entire PreSync phase runs before any Sync-phase resource is
    # even considered. This SA must be a PreSync hook itself (an earlier
    # wave than the Job's default 0) to actually apply first.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-5"
