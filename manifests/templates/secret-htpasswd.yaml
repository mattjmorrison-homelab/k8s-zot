{{- $lines := list }}
{{- $legacySecret := lookup "v1" "Secret" .Release.Namespace "zot-htpasswd-legacy" }}
{{- if $legacySecret }}
{{- $lines = append $lines ((index $legacySecret.data "htpasswd") | b64dec | trim) }}
{{- end }}
{{- range .Values.serviceConsumers }}
{{- $credSecret := lookup "v1" "Secret" $.Release.Namespace (printf "zot-service-cred-%s" .name) }}
{{- if $credSecret }}
{{- $password := (index $credSecret.data "password") | b64dec }}
{{- $lines = append $lines (htpasswd .name $password) }}
{{- end }}
{{- end }}
# Combines the legacy, manually-maintained admin/ci-readonly htpasswd
# blob (zot-htpasswd-legacy, sourced by external-secret.yaml) with a
# generated line per entry in .Values.serviceConsumers (sourced by
# external-secret-service-consumers.yaml). Rendered via `lookup`, so a
# consumer's line only appears once its ExternalSecret has actually
# synced -- on the very first deploy of a new consumer this needs one
# more ArgoCD sync after the PreSync job/ExternalSecret land, same as
# other bootstrap-ordering cases in this homelab.
apiVersion: v1
kind: Secret
metadata:
  name: zot-htpasswd
  namespace: zot
type: Opaque
stringData:
  htpasswd: |
{{ join "\n" $lines | indent 4 }}
