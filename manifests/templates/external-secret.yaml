apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # Legacy, manually-maintained admin/ci-readonly htpasswd blob -- the
  # actual zot-htpasswd Secret Zot mounts is rendered by
  # secret-htpasswd.yaml, which combines this with the generated
  # per-consumer lines below. Renamed off zot-htpasswd so both can exist
  # without colliding.
  name: zot-htpasswd-legacy
  namespace: zot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: SecretStore
  target:
    name: zot-htpasswd-legacy
    creationPolicy: Owner
  data:
    - secretKey: htpasswd
      remoteRef:
        key: homelab/zot
        property: HTPASSWD
