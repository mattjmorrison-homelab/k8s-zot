apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: zot
data:
  config.json: |
    {
      "storage": {
        "rootDirectory": "/var/lib/registry",
        "gc": true,
        "gcInterval": "1h",
        "retention": {
          {{/*
            zot evaluates keepTags entries in list order and stops at the
            first pattern match (confirmed in zot v2.1.20's
            pkg/retention/retention.go getTagPolicy) -- it is not an
            independent OR across entries. The pr-* entry must stay first:
            if the catch-all ".*" entry came first, every pr-* tag would
            match it too and never age out.
          */}}
          "dryRun": true,
          "policies": [
            {
              "repositories": ["**"],
              "deleteUntagged": false,
              "keepTags": [
                {
                  "patterns": ["^pr-.+$"],
                  "pushedWithin": "120h"
                },
                {
                  "patterns": [".*"]
                }
              ]
            }
          ]
        }
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "readTimeout": "{{ .Values.http.readTimeout | default "300s" }}",
        "writeTimeout": "{{ .Values.http.writeTimeout | default "300s" }}",
        "auth": { "htpasswd": { "path": "/secret/htpasswd" } },
        "accessControl": {
          "repositories": {
            {{- $allRepos := list }}
            {{- range .Values.serviceConsumers }}
            {{- range .repositories }}
            {{- $allRepos = append $allRepos . }}
            {{- end }}
            {{- end }}
            {{- range $i, $repo := ($allRepos | uniq) }}
            {{- if $i }},{{ end }}
            {{- $consumers := list }}
            {{- range $.Values.serviceConsumers }}
            {{- if has $repo .repositories }}
            {{- $consumers = append $consumers . }}
            {{- end }}
            {{- end }}
            "{{ $repo }}": {
              "policies": [
                {{- range $j, $consumer := $consumers }}
                {{- if $j }},{{ end }}
                {
                  "users": ["{{ $consumer.name }}"],
                  "actions": {{ $consumer.actions | default (list "read") | toJson }}
                }
                {{- end }}
              ],
              "defaultPolicy": []
            }
            {{- end }}
          }
        }
      },
      "log": { "level": "info" },
      "extensions": {
        "search": { "enable": true },
        "ui": { "enable": true }
      }
    }
