apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: zot
data:
  config.json: |
    {
      "storage": { "rootDirectory": "/var/lib/registry" },
      "http": {
        "address": "0.0.0.0",
        "port": "5000",
        "auth": { "htpasswd": { "path": "/secret/htpasswd" } },
        "accessControl": {
          "repositories": {
            {{- $allRepos := list }}
            {{- range .Values.serviceConsumers }}
            {{- range .repositories }}
            {{- $allRepos = append $allRepos . }}
            {{- end }}
            {{- end }}
            {{- range $i, $repo := ($allRepos | uniq) }}
            {{- if $i }},{{ end }}
            {{- $consumers := list }}
            {{- range $.Values.serviceConsumers }}
            {{- if has $repo .repositories }}
            {{- $consumers = append $consumers . }}
            {{- end }}
            {{- end }}
            "{{ $repo }}": {
              "policies": [
                {{- range $j, $consumer := $consumers }}
                {{- if $j }},{{ end }}
                {
                  "users": ["{{ $consumer.name }}"],
                  "actions": {{ $consumer.actions | default (list "read") | toJson }}
                }
                {{- end }}
              ],
              "defaultPolicy": []
            }
            {{- end }}
          }
        }
      },
      "log": { "level": "info" },
      "extensions": {
        "search": { "enable": true },
        "ui": { "enable": true }
      }
    }
