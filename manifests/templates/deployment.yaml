apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: zot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zot
  template:
    metadata:
      labels:
        app: zot
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        restart-trigger: {{ .Values.restartTrigger | quote }}
    spec:
      serviceAccountName: zot
      initContainers:
        - name: wait-for-htpasswd-refresh
          # Forces and confirms a real ExternalSecret refresh before the
          # main container starts, on every pod start -- closes the race
          # between the PreSync bootstrap job's write and this Secret's own
          # independent refreshInterval timer (see wait-for-htpasswd-refresh.sh).
          image: "{{ .Values.verify.image.repository }}@{{ .Values.verify.image.digest }}"
          command: ["/bin/sh", "/scripts/wait-for-htpasswd-refresh.sh"]
          volumeMounts:
            - name: refresh-script
              mountPath: /scripts
      containers:
        - name: zot
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: config
              mountPath: /etc/zot
            - name: htpasswd
              mountPath: /secret
            - name: data
              mountPath: /var/lib/registry
          livenessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: zot-config
        - name: htpasswd
          secret:
            secretName: zot-htpasswd
        - name: data
          persistentVolumeClaim:
            claimName: zot
        - name: refresh-script
          configMap:
            name: zot-refresh-htpasswd-script
            defaultMode: 0555
